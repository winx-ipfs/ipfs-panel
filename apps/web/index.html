<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e4ece7" />
    <title>ipfs-panel</title>
    <script>
      try {
        var preference = localStorage.getItem('ipfs-panel.theme') || 'system'
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var theme = preference === 'dark' || (preference !== 'light' && dark) ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0c1210' : '#e4ece7')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
