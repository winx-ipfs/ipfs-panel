# Required status check for branch rulesets: ci-ok
#
# The other job names in this workflow are real checks, but they are not
# stable requirements. web and manager skip when their paths do not change.
# pr-title, branch-policy, and dependency-review skip on push.
# integration skips except on a pull request into develop.
# A skipped required check blocks merges, so rulesets require only ci-ok.
# See docs/ORG-SETUP.md.

name: CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      manager: ${{ steps.filter.outputs.manager }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
            manager:
              - 'services/manager/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'AGENTS.md'
              - 'AGENTS.zh-CN.md'
              - '.github/scripts/check-docs.sh'

  pr-body:
    name: pr-body
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # AGENTS.md requires the product to run, the suite to be green, and the
      # printed claim to match observed behaviour. This checks the weakest part
      # of that: the description has a Verification section with evidence in
      # it, rather than an untouched template.
      - name: Test the body checker
        run: bash .github/scripts/check-pr-body.test.sh
      - name: Require evidence in Verification
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash .github/scripts/check-pr-body.sh

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Every doc ships in English and 中文, and relative links between them
      # resolve. Needs no network and no reference clones.
      - name: Check bilingual pairs and links
        run: bash .github/scripts/check-docs.sh

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build-only

  manager:
    name: manager
    needs: changes
    if: needs.changes.outputs.manager == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/manager/go.mod
          cache: true
      - name: gofmt
        working-directory: services/manager
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        working-directory: services/manager
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: services/manager
          # The default install mode downloads a prebuilt binary from the
          # GitHub release assets, which returned HTTP 504 on two consecutive
          # runs (42470476837, 42471051582) before a single linter ran.
          # goinstall builds the pinned version from the Go module proxy
          # instead, so a release-asset outage cannot fail the job while the
          # action's annotations and caching still apply.
          install-mode: goinstall
      - name: Test
        working-directory: services/manager
        run: go test -race -count=1 ./...
      - name: Build
        working-directory: services/manager
        run: go build -o /dev/null ./cmd/manager

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check Conventional Commits title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          validateSingleCommit: true

  branch-policy:
    name: branch-policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Test the policy script
        run: bash .github/scripts/branch-policy.test.sh
      - name: Enforce Git Flow targets
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          GITHUB_EVENT_NAME: pull_request
        run: bash .github/scripts/branch-policy.sh

  integration:
    name: integration
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    uses: ./.github/workflows/integration.yml

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check whether the dependency graph is enabled
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          code="$(curl -sS -o /tmp/depgraph-body -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}")"
          case "$code" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            403|404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "Dependency graph is not enabled yet (HTTP ${code})."
              echo "This job stays green until that switch is on. See docs/ORG-SETUP.md."
              ;;
            *)
              echo "Dependency graph probe returned HTTP ${code}."
              cat /tmp/depgraph-body
              exit 1
              ;;
          esac
      - name: Review dependency changes
        if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  ci-ok:
    name: ci-ok
    if: ${{ !cancelled() }}
    needs:
      - changes
      - docs
      - pr-body
      - web
      - manager
      - pr-title
      - branch-policy
      - dependency-review
      - integration
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass or skip
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCS: ${{ needs.docs.result }}
          PR_BODY: ${{ needs.pr-body.result }}
          WEB: ${{ needs.web.result }}
          MANAGER: ${{ needs.manager.result }}
          PR_TITLE: ${{ needs.pr-title.result }}
          BRANCH_POLICY: ${{ needs.branch-policy.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          set -eu
          fail=0
          for name in CHANGES DOCS PR_BODY WEB MANAGER PR_TITLE BRANCH_POLICY DEPENDENCY_REVIEW INTEGRATION; do
            value="${!name}"
            echo "$name=$value"
            case "$value" in
              success|skipped) ;;
              *) fail=1 ;;
            esac
          done
          exit "$fail"
