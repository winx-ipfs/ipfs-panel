name: Labels

on:
  push:
    branches: [main, develop]
    paths:
      - .github/labels.json
      - .github/scripts/sync-labels.py
      - .github/workflows/labels.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: labels-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  sync-labels:
    name: sync-labels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Sync labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/sync-labels.py
